    <div class="max-w-[1700px] mx-auto mb-3 flex items-center justify-between flex-wrap gap-2">
        <a href="../../../index.html" class="inline-flex items-center gap-1 text-sm text-gray-600 hover:text-blue-600 bg-white px-3 py-1.5 rounded-md shadow-sm">&larr; 返回工作台</a>
        <span class="text-xs text-gray-400 font-mono">复刻自真实 Mailchimp 模板 (TRIPLE LEAD) · 固定区块已锁定</span>
    </div>
    <div id="app" class="max-w-[1700px] mx-auto flex gap-5" style="height: calc(100vh - 110px);">
        <div class="w-[42%] min-w-[480px] bg-white p-5 rounded-lg shadow-md overflow-y-auto">
            <div class="flex items-center gap-2 mb-5 border-b pb-4">
                <span class="text-3xl">📰</span>
                <div>
                    <h2 class="text-xl font-bold text-gray-800">日文站 行业新闻双周报</h2>
                    <p class="text-xs text-gray-400 mt-0.5">ChemLinked Japan メールマガジン（毎月2回）</p>
                </div>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-bold text-gray-700 mb-1">1. 邮件标题（&lt;title&gt; / 主题行参考）</label>
                <textarea v-model="mailData.title" rows="2" class="block w-full border border-gray-300 rounded-md p-2 text-sm"></textarea>
            </div>

            <div class="mb-5 bg-gray-50 p-4 rounded-md border border-gray-200">
                <label class="block text-sm font-bold text-gray-700 mb-2">2. 期号与配信日期（★头部自动生成）</label>
                <div class="flex gap-2">
                    <input v-model="mailData.issue" type="text" placeholder="期号，如 2026年11月前半号" class="flex-1 border border-gray-300 rounded-md p-1.5 text-sm">
                    <input v-model="mailData.date" type="text" placeholder="2026/11/10" class="w-1/3 border border-gray-300 rounded-md p-1.5 text-sm">
                </div>
            </div>

            <div class="mb-5">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-bold text-gray-700">3. 新闻区（目次自动生成）</label>
                    <button @click="addRegion" class="bg-blue-500 text-white px-2 py-1 rounded text-xs hover:bg-blue-600">+ 添加新闻区</button>
                </div>
                <div v-for="(r, ri) in mailData.regions" :key="'r'+ri" class="bg-gray-50 p-4 rounded-md mb-4 border border-gray-200">
                    <div class="flex gap-2 mb-3 items-center">
                        <input v-model="r.name" type="text" placeholder="区名，如 アジア太平洋地域" class="flex-1 border border-gray-300 rounded-md p-1.5 text-sm font-semibold">
                        <button @click="removeRegion(ri)" class="text-red-500 text-xs font-bold hover:underline">删除区</button>
                    </div>
                    <div class="bg-white p-3 rounded-md border border-gray-200 mb-3">
                        <p class="text-xs font-bold text-gray-600 mb-2">头条新闻（日期色块 + 标题链接 + 摘要）</p>
                        <div class="flex gap-2 mb-2">
                            <input v-model="r.headline.date" type="text" placeholder="2026/11/03" class="w-1/4 border border-gray-300 rounded-md p-1.5 text-sm">
                            <input v-model="r.headline.title" type="text" placeholder="标题" class="flex-1 border border-gray-300 rounded-md p-1.5 text-sm">
                        </div>
                        <input v-model="r.headline.link" type="text" placeholder="链接（自动加 utm_source=edm）" class="block w-full border border-gray-300 rounded-md p-1.5 text-sm mb-2">
                        <textarea v-model="r.headline.summary" rows="4" placeholder="摘要（建议以 … 结尾）" class="block w-full border border-gray-300 rounded-md p-1.5 text-sm"></textarea>
                    </div>
                    <div class="bg-white p-3 rounded-md border border-gray-200">
                        <div class="flex justify-between items-center mb-2">
                            <p class="text-xs font-bold text-gray-600">その他の記事一覧</p>
                            <button @click="addMore(r)" class="bg-blue-500 text-white px-2 py-0.5 rounded text-xs hover:bg-blue-600">+ 条目</button>
                        </div>
                        <div v-for="(m, mi) in r.more" :key="'m'+mi" class="flex gap-2 mb-2 items-center">
                            <input v-model="m.title" type="text" placeholder="标题" class="flex-1 border border-gray-300 rounded-md p-1.5 text-sm">
                            <input v-model="m.link" type="text" placeholder="链接" class="w-2/5 border border-gray-300 rounded-md p-1.5 text-sm">
                            <button @click="removeMore(r, mi)" class="text-red-500 text-xs font-bold hover:underline">删</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-5">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-bold text-gray-700">4. 新着Ebook 卡片</label>
                    <button @click="addBook" class="bg-blue-500 text-white px-2 py-1 rounded text-xs hover:bg-blue-600">+ 添加 Ebook</button>
                </div>
                <div v-for="(b, bi) in mailData.books" :key="'b'+bi" class="bg-gray-50 p-4 rounded-md mb-3 border border-gray-200">
                    <div class="flex justify-end mb-1"><button @click="removeBook(bi)" class="text-red-500 text-xs font-bold hover:underline">删除</button></div>
                    <input v-model="b.title" type="text" placeholder="Ebook 标题" class="block w-full border border-gray-300 rounded-md p-1.5 text-sm mb-2">
                    <input v-model="b.link" type="text" placeholder="详情链接" class="block w-full border border-gray-300 rounded-md p-1.5 text-sm mb-2">
                    <input v-model="b.imgUrl" type="text" placeholder="封面图 URL（mcusercontent 258px）" class="block w-full border border-gray-300 rounded-md p-1.5 text-sm mb-2">
                    <textarea v-model="b.summary" rows="4" placeholder="简介（建议以 … 结尾）" class="block w-full border border-gray-300 rounded-md p-1.5 text-sm mb-2"></textarea>
                    <input v-model="b.btnText" type="text" placeholder="按钮文字" class="block w-full border border-gray-300 rounded-md p-1.5 text-sm">
                </div>
            </div>

            <div class="text-xs text-gray-400 bg-gray-50 border border-dashed border-gray-300 rounded-md p-3 leading-relaxed">
                固定区块（与真实邮件一致，无需编辑）：开场白、有料会員限定公告、◎活用のメリット◎、页脚与退订。<br>
                目次根据新闻区头条与 Ebook 标题自动生成。
            </div>
        </div>
