    <div class="max-w-[1700px] mx-auto mb-3 flex items-center justify-between flex-wrap gap-2">
        <a href="../../../index.html" class="inline-flex items-center gap-1 text-sm text-gray-600 hover:text-blue-600 bg-white px-3 py-1.5 rounded-md shadow-sm">&larr; 返回工作台</a>
        <span class="text-xs text-gray-400 font-mono">复刻自真实 Mailchimp 模板 (TRIPLE LEAD) · 固定区块已锁定</span>
    </div>
    <div id="app" class="max-w-[1700px] mx-auto flex gap-5" style="height: calc(100vh - 110px);">
        <div class="w-[42%] min-w-[480px] bg-white p-5 rounded-lg shadow-md overflow-y-auto">
            <div class="flex items-center gap-2 mb-5 border-b pb-4">
                <span class="text-3xl">📚</span>
                <div>
                    <h2 class="text-xl font-bold text-gray-800">日文站 Ebook 速递</h2>
                    <p class="text-xs text-gray-400 mt-0.5">【新着Ebook】日本語仮訳 Ebook 告知邮件</p>
                </div>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-bold text-gray-700 mb-1">1. 邮件标题（&lt;title&gt; / 主题行参考）</label>
                <textarea v-model="mailData.title" rows="2" class="block w-full border border-gray-300 rounded-md p-2 text-sm"></textarea>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-bold text-gray-700 mb-1">2. 引言段（空行分段，段首全角空格请自行保留）</label>
                <textarea v-model="mailData.intro" rows="4" class="block w-full border border-gray-300 rounded-md p-2 text-sm"></textarea>
            </div>

            <div class="mb-5 bg-gray-50 p-4 rounded-md border border-gray-200">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-bold text-gray-700">3. 名录列表（Ebook 清单）</label>
                    <button @click="addItem" class="bg-blue-500 text-white px-2 py-1 rounded text-xs hover:bg-blue-600">+ 添加条目</button>
                </div>
                <div v-for="(it, i) in mailData.items" :key="'it'+i" class="flex gap-2 mb-2 items-center">
                    <input v-model="it.title" type="text" placeholder="条目文字（如 GB 30000.7-202X …）" class="flex-1 border border-gray-300 rounded-md p-1.5 text-sm">
                    <input v-model="it.link" type="text" placeholder="链接" class="w-2/5 border border-gray-300 rounded-md p-1.5 text-sm">
                    <button @click="removeItem(i)" class="text-red-500 text-xs font-bold hover:underline">删</button>
                </div>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-bold text-gray-700 mb-1">4. 补充说明段（空行分段）</label>
                <textarea v-model="mailData.note" rows="6" class="block w-full border border-gray-300 rounded-md p-2 text-sm"></textarea>
            </div>

            <div class="mb-5">
                <label class="block text-sm font-bold text-gray-700 mb-1">5. 引导标题行</label>
                <input v-model="mailData.guideTitle" type="text" class="block w-full border border-gray-300 rounded-md p-2 text-sm">
            </div>

            <div class="mb-5">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-bold text-gray-700">6. Ebook 卡片（图左 258px + 文右 + 按钮）</label>
                    <button @click="addBook" class="bg-blue-500 text-white px-2 py-1 rounded text-xs hover:bg-blue-600">+ 添加卡片</button>
                </div>
                <div v-for="(b, bi) in mailData.books" :key="'b'+bi" class="bg-gray-50 p-4 rounded-md mb-3 border border-gray-200">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-gray-500">卡片 {{ bi + 1 }}</span>
                        <button @click="removeBook(bi)" class="text-red-500 text-xs font-bold hover:underline">删除</button>
                    </div>
                    <textarea v-model="b.title" rows="3" placeholder="标题（换行 = 标题行）" class="block w-full border border-gray-300 rounded-md p-1.5 text-sm mb-2"></textarea>
                    <input v-model="b.link" type="text" placeholder="详情链接" class="block w-full border border-gray-300 rounded-md p-1.5 text-sm mb-2">
                    <input v-model="b.imgUrl" type="text" placeholder="封面图 URL（mcusercontent 258px）" class="block w-full border border-gray-300 rounded-md p-1.5 text-sm mb-2">
                    <textarea v-model="b.desc" rows="6" placeholder="说明（换行 = 换行）" class="block w-full border border-gray-300 rounded-md p-1.5 text-sm mb-2"></textarea>
                    <input v-model="b.btnText" type="text" placeholder="按钮文字" class="block w-full border border-gray-300 rounded-md p-1.5 text-sm">
                </div>
            </div>

            <div class="text-xs text-gray-400 bg-gray-50 border border-dashed border-gray-300 rounded-md p-3 leading-relaxed">
                固定区块（与真实邮件一致，无需编辑）：★头部、◎活用のメリット◎、页脚与退订。<br>
                每张卡片自动附带分隔线与「詳細はこちら」按钮（#2BAADF）。
            </div>
        </div>
        <div class="flex-1 flex flex-col min-w-0">
            <div class="flex items-center justify-between mb-3">
                <div class="flex bg-gray-200 rounded-lg p-1 gap-1">
                    <button @click="viewMode='preview'" :class="viewMode==='preview' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'" class="px-4 py-1.5 text-sm rounded-md font-medium">预览</button>
                    <button @click="viewMode='code'" :class="viewMode==='code' ? 'bg-white shadow text-blue-600' : 'text-gray-500 hover:text-gray-700'" class="px-4 py-1.5 text-sm rounded-md font-medium">源码</button>

                <button @click="copyHtml" class="bg-green-600 hover:bg-green-700 text-white text-sm font-semibold px-4 py-2 rounded-md transition-colors">{{ copyBtnText }}</button>
            </div>
            <iframe v-if="viewMode==='preview'" :srcdoc="generatedHtml" class="w-full flex-1 bg-white rounded-lg shadow-md border border-gray-200"></iframe>
            <textarea v-else :value="generatedHtml" readonly class="w-full flex-1 font-mono text-[11px] leading-relaxed p-3 bg-gray-800 text-green-200 rounded-lg border border-gray-700"></textarea>
        </div>
    </div>
